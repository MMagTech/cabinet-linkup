# A home server. Forward 7845/tcp on the router, and the relay's UDP ports only if the relay
# is on. Never forward 7846: it is the admin page. Make the data folder first, owned by the
# user below: mkdir data && sudo chown 1000:1000 data
services:
  linkup:
    image: ghcr.io/mmagtech/cabinet-linkup:latest
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data:/data
    ports:
      - "7845:7845/tcp"
      - "7846:7846/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
